# Replace LEOTREE_HOST with the public IP or domain the certificate was issued for.
server {
    listen 80;
    server_name LEOTREE_HOST;
    location ^~ /.well-known/acme-challenge/ { root /var/www/leotree-acme; }
    location / { return 302 https://LEOTREE_HOST$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name LEOTREE_HOST;
    ssl_certificate /etc/letsencrypt/live/LEOTREE_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/LEOTREE_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Knowledge never leaves the browser; uploads only reach the auth endpoints.
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Same-origin only: the app loads no third-party scripts, styles or images.
    # 'unsafe-inline' covers the small boot script in the document head and
    # inline style attributes; blob:/data: serve attachment previews and downloads.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
