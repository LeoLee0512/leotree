# /etc/nginx/conf.d/tree.leomath.conf
# Leo Tree at tree.leomath.cn, proxied to the Docker container on 127.0.0.1:3008.
# Coexists with LeoMath (leomath.cn) on the same nginx: server_name decides.
# After installing: certbot --nginx -d tree.leomath.cn
server {
    listen 80;
    listen [::]:80;
    server_name tree.leomath.cn;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
